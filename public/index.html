<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema de Control</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-left">
        <img src="logo-universidad.png" alt="UPQROO" class="logo">
        <div class="divider"></div>
        <h1 class="system-title">Acceso de Usuarios</h1>
      </div>
      <div class="admin-section">
        <a class="tab-button" href="login.html">Acceso Administrador</a>
      </div>
    </div>
  </header>

  <main>
    <div class="scanner-container">
      <h2>Presenta tu código QR</h2>
      <p class="instructions">Coloca tu QR frente a la cámara para validar tu acceso</p>
      <div id="reader"></div>
      <div id="result" class="resultado-escaneo">
        Esperando escanear código QR...
      </div>
      <div class="scanner-controls">
        <button id="continueButton" class="control-button" style="display: none;">Continuar escaneando</button>
      </div>
      <div class="alert" id="alert" style="display: none;"></div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>
  <script src="client.js"></script>
</body>
</html>
