<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Escáner QR</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="utilities.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-left">
        <img src="logo-universidad.png" alt="UPQROO" class="logo">
        <div class="divider"></div>
        <h1 class="system-title">Escáner de Acceso</h1>
      </div>
    </div>
  </header>

  <main>
    <div class="scanner-container">
      <h2>Escanear Código QR</h2>
      <p class="instructions">Coloca tu código QR frente a la cámara</p>
      <div id="reader"></div>
      <div id="result">Esperando escanear código QR...</div>
      <div class="scanner-controls">
        <button id="continueButton" class="control-button" style="display: none;">
          Continuar Escaneando
        </button>
      </div>
      
      <!-- Configuración de Auto-escaneo -->
      <div class="auto-scan-config">
        <h4>Configuración de Auto-escaneo</h4>
        <div class="config-row">
          <label for="autoScanDelayInput">Tiempo de espera (segundos):</label>
          <div class="config-input-group">
            <input 
              type="number" 
              id="autoScanDelayInput" 
              min="1" 
              max="30" 
              value="3"
              class="config-input"
            >
            <button onclick="actualizarTiempoAutoScan(document.getElementById('autoScanDelayInput').value * 1000)" class="config-btn">
              Aplicar
            </button>
          </div>
        </div>
        <div class="config-row">
          <button id="autoScanToggle" onclick="toggleAutoScan()" class="toggle-btn btn-active">
            Auto-escaneo: ON
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="client.js"></script>
</body>
</html>
